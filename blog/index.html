---
layout: default
title: Blog | Thuta Aung
description: Writing and project updates from Thuta Aung.
---
<section class="page prose">
	<h1>Blog</h1>
	<ul class="posts">
		{% for post in site.posts %}
		<li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date_to_string }}</time> <span aria-hidden="true">&raquo;</span> <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
		{% endfor %}
	</ul>
</section>
